<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Menu Resto - Sistem PBO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --white: #ffffff;
            --error-red: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Gambar background makanan estetik */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- STYLING LOGIN FORM --- */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
            color: white;
        }

        h2 { margin-bottom: 25px; font-weight: 600; }

        .form-group { margin-bottom: 15px; text-align: left; }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-login { background-color: var(--primary-green); color: white; }
        .btn-login:hover { background-color: var(--dark-green); }

        .btn-cancel { background-color: var(--white); color: #333; }
        .btn-cancel:hover { background-color: #f1f1f1; }

        #error-msg {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* --- STYLING DASHBOARD MENU --- */
        #dashboard-page {
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            display: none; /* Hidden by default */
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .menu-card {
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }

        .menu-card:hover { transform: translateY(-5px); }

        .menu-card h4 { color: #2c3e50; margin-bottom: 5px; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: #eee;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-bottom: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-page" class="container">
        <h2>Resto Login</h2>
        <div class="form-group">
            <input type="text" id="username" placeholder="Username">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        <div id="error-msg">Gagal login</div>
        <div class="btn-group">
            <button class="btn-cancel" onclick="app.clearForm()">Cancel</button>
            <button class="btn-login" onclick="app.handleLogin()">Login</button>
        </div>
    </div>

    <div id="dashboard-page" class="container" style="width: 90%; text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="welcome-text">Hi User</h2>
            <button class="btn-cancel" style="flex: none; width: 100px;" onclick="app.logout()">Logout</button>
        </div>
        
        <h3 style="margin-top: 20px;">Daftar Menu Makanan & Minuman</h3>
        <div id="menu-container" class="menu-grid">
            </div>
    </div>

    <script>
        /**
         * --- KONSEP PEMROGRAMAN BERORIENTASI OBJEK (PBO) ---
         */

        // 1. Class User untuk representasi data Akun
        class User {
            constructor(username, password) {
                this.username = username;
                this.password = password;
            }
        }

        // 2. Class Menu untuk representasi Item Makanan/Minuman
        class Menu {
            constructor(nama, kategori) {
                this.nama = nama;
                this.kategori = kategori;
            }
        }

        // 3. Class Database untuk menangani Local Storage
        class Database {
            constructor() {
                this.storageKey = 'db_user_json';
                this.init();
            }

            init() {
                // Set akun admin awal jika belum ada di LocalStorage
                if (!localStorage.getItem(this.storageKey)) {
                    const initialUsers = [
                        new User('admin1', '123'),
                        new User('admin2', '123'),
                        new User('admin3', '123')
                    ];
                    localStorage.setItem(this.storageKey, JSON.stringify(initialUsers));
                }
            }

            getUsers() {
                return JSON.parse(localStorage.getItem(this.storageKey));
            }
        }

        // 4. Class AppController (Main Logic)
        class App {
            constructor() {
                this.db = new Database();
                this.menus = [
                    new Menu('Nasi Goreng', 'Makanan'),
                    new Menu('Dimsum', 'Makanan'),
                    new Menu('Bakso', 'Makanan'),
                    new Menu('Mie Ayam', 'Makanan'),
                    new Menu('Sate', 'Makanan'),
                    new Menu('Seblak', 'Makanan'),
                    new Menu('Aneka Jus', 'Minuman'),
                    new Menu('Air Mineral', 'Minuman'),
                    new Menu('Susu', 'Minuman'),
                    new Menu('Kopi', 'Minuman')
                ];
            }

            handleLogin() {
                const userIn = document.getElementById('username').value;
                const passIn = document.getElementById('password').value;
                const errorDisplay = document.getElementById('error-msg');

                const users = this.db.getUsers();
                
                // Cari user di dalam object database
                const foundUser = users.find(u => u.username === userIn && u.password === passIn);

                if (foundUser) {
                    errorDisplay.style.display = 'none';
                    this.showDashboard(foundUser.username);
                } else {
                    errorDisplay.style.display = 'block';
                }
            }

            showDashboard(name) {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('dashboard-page').style.display = 'block';
                document.getElementById('welcome-text').innerText = `Hi ${name}`;
                this.renderMenu();
            }

            renderMenu() {
                const container = document.getElementById('menu-container');
                container.innerHTML = '';

                this.menus.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'menu-card';
                    card.innerHTML = `
                        <span class="badge">${item.kategori}</span>
                        <h4>${item.nama}</h4>
                    `;
                    container.appendChild(card);
                });
            }

            logout() {
                document.getElementById('login-page').style.display = 'block';
                document.getElementById('dashboard-page').style.display = 'none';
                this.clearForm();
            }

            clearForm() {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                document.getElementById('error-msg').style.display = 'none';
            }
        }

        // --- INSTANSIASI OBJEK ---
        const app = new App();

    </script>
</body>
</html>
