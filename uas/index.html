<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlavorFlow - Resto Management System (PBO)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --white: #ffffff;
            --error-red: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container & Glassmorphism */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 450px;
            text-align: center;
            color: white;
            transition: 0.5s;
        }

        h2 { margin-bottom: 20px; font-weight: 600; }

        .form-group { margin-bottom: 15px; text-align: left; }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-login { background-color: var(--primary-green); color: white; }
        .btn-login:hover { background-color: var(--dark-green); transform: scale(1.02); }

        .btn-cancel { background-color: var(--white); color: #333; }
        .btn-cancel:hover { background-color: #f1f1f1; transform: scale(1.02); }

        #error-msg {
            color: #ffcc00;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
        }

        /* Dashboard Styles */
        #dashboard-page {
            width: 90%;
            max-width: 1100px;
            max-height: 90vh;
            overflow-y: auto;
            display: none;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-card {
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="login-page" class="container">
        <h2>Resto Login</h2>
        <div id="error-msg">Gagal login! Periksa kembali akun anda.</div>
        <div class="form-group">
            <input type="text" id="username" placeholder="Username (admin1/2/3)">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password (123)">
        </div>
        <div class="btn-group">
            <button class="btn-cancel" onclick="app.clearForm()">Cancel</button>
            <button class="btn-login" onclick="app.handleLogin()">Login</button>
        </div>
    </div>

    <div id="dashboard-page" class="container" style="text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px;">
            <h2 id="welcome-text" style="margin-bottom:0">Hi User</h2>
            <button class="btn-cancel" style="flex:none; width: 120px;" onclick="app.logout()">Logout</button>
        </div>
        
        <h3 style="margin-top: 25px;">Daftar Menu Makanan & Minuman</h3>
        <div id="menu-container" class="menu-grid">
            </div>
    </div>

    <script>
        // [CLASS] Representasi Akun
        class User {
            constructor(username, password) {
                this.username = username;
                this.password = password;
            }
        }

        // [CLASS] Representasi Item Menu
        class Menu {
            constructor(nama, kategori) {
                this.nama = nama;
                this.kategori = kategori;
            }
        }

        // [CLASS] Pengelola Database LocalStorage
        class Database {
            constructor() {
                this.storageKey = 'db_resto_pbo';
                this.init();
            }

            init() {
                if (!localStorage.getItem(this.storageKey)) {
                    const admins = [
                        new User('admin1', '123'),
                        new User('admin2', '123'),
                        new User('admin3', '123')
                    ];
                    localStorage.setItem(this.storageKey, JSON.stringify(admins));
                }
            }

            getUsers() {
                return JSON.parse(localStorage.getItem(this.storageKey));
            }
        }

        // [CLASS] Controller Utama Aplikasi
        class App {
            constructor() {
                this.db = new Database();
                this.menus = [
                    new Menu('Nasi Goreng Spesial', 'Makanan'),
                    new Menu('Dimsum Ayam', 'Makanan'),
                    new Menu('Bakso Urat', 'Makanan'),
                    new Menu('Mie Ayam Jamur', 'Makanan'),
                    new Menu('Sate Madura', 'Makanan'),
                    new Menu('Seblak Komplit', 'Makanan'),
                    new Menu('Aneka Jus Buah', 'Minuman'),
                    new Menu('Air Mineral Vibe', 'Minuman'),
                    new Menu('Susu Segar', 'Minuman'),
                    new Menu('Kopi Gula Aren', 'Minuman')
                ];
            }

            handleLogin() {
                const u = document.getElementById('username').value;
                const p = document.getElementById('password').value;
                const err = document.getElementById('error-msg');

                const users = this.db.getUsers();
                const validUser = users.find(user => user.username === u && user.password === p);

                if (validUser) {
                    err.style.display = 'none';
                    this.showDashboard(validUser.username);
                } else {
                    err.style.display = 'block';
                }
            }

            showDashboard(name) {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('dashboard-page').style.display = 'block';
                document.getElementById('welcome-text').innerText = `Hi ${name}`;
                this.renderMenu();
            }

            renderMenu() {
                const container = document.getElementById('menu-container');
                container.innerHTML = '';
                
                this.menus.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'menu-card';
                    card.innerHTML = `
                        <span class="badge">${item.kategori}</span>
                        <h4>${item.nama}</h4>
                    `;
                    container.appendChild(card);
                });
            }

            logout() {
                document.getElementById('login-page').style.display = 'block';
                document.getElementById('dashboard-page').style.display = 'none';
                this.clearForm();
            }

            clearForm() {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                document.getElementById('error-msg').style.display = 'none';
            }
        }

        // [OBJECT] Instansiasi aplikasi
        const app = new App();

    </script>
</body>
</html>
