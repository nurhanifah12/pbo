<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Login Alam</title>
    <style>
        /* CSS untuk tampilan menarik */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Gambar Alam dari Unsplash */
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: white;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #2e7d32;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1b5e20;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            color: #ffcdd2;
        }

        /* Halaman Dashboard */
        #dashboard {
            display: none;
        }

        .welcome-box {
            font-size: 24px;
        }

        .logout-btn {
            background-color: #c62828;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="loginForm">
        <h2>Selamat Datang</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Masukkan nama...">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Masukkan password...">
        </div>
        <button onclick="handleLogin()">Login</button>
        <p id="message"></p>
    </div>

    <div class="container" id="dashboard">
        <div class="welcome-box">
            Hi, <span id="displayName"></span>!
        </div>
        <p style="margin-top: 10px;">Anda berhasil masuk ke sistem.</p>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        // 1. Inisialisasi Database JSON di LocalStorage
        const initialUsers = [
            { username: "nur hanifah", password: "123" },
            { username: "budi santoso", password: "456" },
            { username: "siti aminah", password: "789" }
        ];

        // Simpan ke local storage jika belum ada
        if (!localStorage.getItem('userDB')) {
            localStorage.setItem('userDB', JSON.stringify(initialUsers));
        }

        // 2. Fungsi Login
        function handleLogin() {
            const userInp = document.getElementById('username').value.toLowerCase();
            const passInp = document.getElementById('password').value;
            const message = document.getElementById('message');

            // Ambil data dari Local Storage
            const userDB = JSON.parse(localStorage.getItem('userDB'));

            // Cari user yang cocok
            const userFound = userDB.find(u => u.username.toLowerCase() === userInp && u.password === passInp);

            if (userFound) {
                // Berhasil Login
                showDashboard(userFound.username);
            } else {
                // Gagal Login
                message.innerText = "Gagal login! Username atau password salah.";
                setTimeout(() => { message.innerText = ""; }, 3000);
            }
        }

        // 3. Fungsi Tampilkan Halaman User
        function showDashboard(name) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('displayName').innerText = name.toUpperCase();
        }

        // 4. Fungsi Logout
        function handleLogout() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }
    </script>
</body>
</html>
